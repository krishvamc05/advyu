name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Build
        run: |
          npm run build
          mkdir -p dist/contact-us dist/contact dist/privacy-policy dist/privacy dist/terms dist/terms-and-conditions dist/terms-of-service dist/refund-policy dist/refund-and-cancellation dist/refund dist/shipping-policy dist/shipping-and-delivery dist/fulfillment-policy
          cp dist/index.html dist/contact-us/index.html
          cp dist/index.html dist/contact/index.html
          cp dist/index.html dist/privacy-policy/index.html
          cp dist/index.html dist/privacy/index.html
          cp dist/index.html dist/terms/index.html
          cp dist/index.html dist/terms-and-conditions/index.html
          cp dist/index.html dist/terms-of-service/index.html
          cp dist/index.html dist/refund-policy/index.html
          cp dist/index.html dist/refund-and-cancellation/index.html
          cp dist/index.html dist/refund/index.html
          cp dist/index.html dist/shipping-policy/index.html
          cp dist/index.html dist/shipping-and-delivery/index.html
          cp dist/index.html dist/fulfillment-policy/index.html
          cp dist/index.html dist/404.html
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
